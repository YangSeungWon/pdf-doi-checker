<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference DOI Checker</title>
<meta name="description" content="Check a paper's references against official DOI metadata. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1 data-i18n="title">Reference DOI Checker</h1>
    <div class="lang" id="lang" role="group" aria-label="Language"></div>
  </div>
  <p class="tagline" data-i18n="tagline"></p>
  <p class="privacy"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></p>
</header>

<main>
  <section class="panel">
    <div id="drop" class="drop" tabindex="0" role="button">
      <span class="drop-icon" aria-hidden="true">📄</span>
      <strong data-i18n="drop"></strong>
      <span class="drop-sub" data-i18n="dropSub"></span>
      <span id="filename" class="filename"></span>
    </div>
    <input id="file" type="file" accept="application/pdf" hidden>

    <div class="actions">
      <button id="run" class="primary" disabled>
        <span aria-hidden="true">▶</span> <span data-i18n="run"></span>
      </button>
      <details class="opts">
        <summary><span aria-hidden="true">⚙</span> <span data-i18n="options"></span></summary>
        <div class="opts-body">
          <label><input type="checkbox" id="opt-find-missing" checked> <span data-i18n="optFind"></span></label>
          <label><input type="checkbox" id="opt-errors-only"> <span data-i18n="optErrors"></span></label>
          <label><input type="checkbox" id="opt-show-ok"> <span data-i18n="optOk"></span></label>
          <label class="inline"><span data-i18n="optWorkers"></span>
            <input type="number" id="opt-workers" value="6" min="1" max="12"></label>
          <label class="inline"><span data-i18n="optMail"></span>
            <input type="email" id="opt-mailto" placeholder="you@example.com">
            <span class="hint" data-i18n="optMailHint"></span></label>
          <button id="clear-cache" class="ghost"><span aria-hidden="true">🗑</span> <span data-i18n="clearCache"></span></button>
        </div>
      </details>
    </div>

    <p id="status" class="status"></p>
    <div id="progress" class="progress" hidden><div id="bar"></div></div>
  </section>

  <section id="summary" class="summary" hidden></section>

  <div id="exports" class="actions exports" hidden>
    <button id="dl-json" class="ghost"><span aria-hidden="true">⭳</span> <span data-i18n="dlJson"></span></button>
    <button id="dl-bib" class="ghost"><span aria-hidden="true">⭳</span> <span data-i18n="dlBib"></span></button>
  </div>

  <section id="results" class="results"></section>

  <details id="debug" class="panel debug" hidden>
    <summary data-i18n="debug"></summary>
    <div id="debug-body"></div>
  </details>
</main>

<footer class="foot">
  <p>
    pdf.js v<span id="pdfjs-version">?</span> ·
    <a href="https://www.doi.org/factsheets/DOIProxy.html" target="_blank" rel="noopener">doi.org</a> ·
    <a href="https://api.crossref.org" target="_blank" rel="noopener">Crossref</a>
  </p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
