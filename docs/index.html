<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference DOI Checker</title>
<meta name="description" content="Check a paper's references against official DOI metadata. Runs entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1 data-i18n="title">Reference DOI Checker</h1>
  <div class="lang" id="lang" role="group" aria-label="Language"></div>
</header>

<main>
  <section id="pick" class="panel">
    <div id="drop" class="drop" tabindex="0" role="button">
      <span class="drop-icon" aria-hidden="true">📄</span>
      <strong data-i18n="drop"></strong>
      <span class="drop-sub" data-i18n="dropSub"></span>
      <span id="filename" class="filename"></span>
    </div>
    <input id="file" type="file" accept="application/pdf" hidden>
    <div class="actions">
      <button id="run" class="primary" disabled>
        <span aria-hidden="true">▶</span> <span data-i18n="run"></span>
      </button>
    </div>
  </section>

  <div id="filebar" class="filebar" hidden>
    <span class="fb-icon" aria-hidden="true">📄</span>
    <span id="fb-name" class="fb-name"></span>
    <button id="reset" class="ghost"><span aria-hidden="true">↻</span> <span data-i18n="newFile"></span></button>
  </div>

  <p id="status" class="status"></p>
  <div id="progress" class="progress" hidden><div id="bar"></div></div>

  <section id="summary" class="summary" hidden></section>
  <section id="results" class="results"></section>

  <div id="exports" class="actions exports" hidden>
    <button id="dl-bib" class="ghost" data-i18n-title="dlBibTip"><span aria-hidden="true">⭳</span> <span data-i18n="dlBib"></span></button>
  </div>

  <details id="debug" class="panel debug" hidden>
    <summary data-i18n="debug"></summary>
    <div id="debug-body"></div>
  </details>
</main>

<footer class="foot">
  <p>
    <span aria-hidden="true">🔒</span> <span data-i18n="footPrivacy"></span> ·
    pdf.js v<span id="pdfjs-version">?</span> ·
    <a href="https://www.doi.org/factsheets/DOIProxy.html" target="_blank" rel="noopener">doi.org</a> ·
    <a href="https://api.crossref.org" target="_blank" rel="noopener">Crossref</a>
  </p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
